      <section class="relative bg-slate-200 dark:bg-slate-800 min-h-[70vh]">
        <div class="glide hero-slider">
          
          <div class="glide__track" data-glide-el="track">
            <ul class="glide__slides">
              
              <li class="glide__slide">
                <div class="relative h-[70vh] w-full flex items-center justify-center bg-slate-800">
                  <img src="/images/hero-1.webp" alt="Costa Rica Nature" class="absolute inset-0 w-full h-full object-cover opacity-60">
                  <div class="relative z-10 text-center">
                    <h2 class="text-4xl md:text-6xl font-bold text-white uppercase tracking-tighter">Luxury Concierge</h2>
                    <p class="text-white mt-4 text-lg">Experiencias inolvidables en el paraíso.</p>
                  </div>
                </div>
              </li>

              <li class="glide__slide">

                  <img src="/images/hero-2.webp" alt="Costa Rica Beach" class="absolute inset-0 w-full h-full object-cover opacity-60">
                  <div class="relative z-10 text-center">

                    <p class="text-white mt-4 text-lg">Transporte, Tours y Reubicación.</p>
                  </div>
                </div>
              </li>

            </ul>
          </div>

          <div class="glide__arrows" data-glide-el="controls">
            <button class="glide__arrow glide__arrow--left absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 p-3 rounded-full text-white transition-all" data-glide-dir="<">

            </button>
            <button class="glide__arrow glide__arrow--right absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 p-3 rounded-full text-white transition-all" data-glide-dir=">">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
            </button>
          </div>

          <div class="glide__bullets absolute bottom-8 left-1/2 -translate-x-1/2 flex space-x-2" data-glide-el="controls[nav]">

            <button class="glide__bullet w-3 h-3 rounded-full bg-white/50" data-glide-dir="=1"></button>

    <script src="/js/vendors/glide.min.js"></script>

    <script>
      window.addEventListener('load', function() {
        // Verificamos que Glide esté definido para evitar errores en consola
        if (typeof Glide !== 'undefined') {
          new Glide('.hero-slider', {
            type: 'carousel',
            perView: 1,
            autoplay: 4000,
            gap: 0
          }).mount();
        } else {
          console.error("Error: Glide.js no se cargó. Revisa la ruta /js/vendors/glide.min.js");
        }
      });
    </script>
