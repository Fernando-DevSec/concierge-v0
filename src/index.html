<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://conciergevipcostarica.com/en/" />

    <meta http-equiv="refresh" content="0; url=/en/">

    <title>Concierge VIP Costa Rica | Premium Services</title>

    <script>
        /**
         * Redirección inmediata por JavaScript.
         * Usamos .replace() para que el usuario no quede atrapado 
         * en un bucle al presionar el botón "Atrás".
         */
        window.location.replace("/en/");
    </script>

    <style>
        body {
            background-color: #0c0c0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .loader-container {
            text-align: center;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 2px solid #d4af37;
            border-top-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        .text {
            color: #ffffff;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loader-container">
        <div class="loader" role="status"></div>
        <p class="text">Loading Luxury Experience...</p>

        <noscript>
            <a href="/en/" style="color: #d4af37; text-decoration: underline; display: block; margin-top: 20px;">
                Enter Concierge VIP Costa Rica
            </a>
        </noscript>
    </div>

</body>

</html>
